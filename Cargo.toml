[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cpu-armv7m",
    "crates/periph-stm32f4",
    "crates/circuit",
    "crates/elf",
    "crates/nucleo",
    "crates/difftest",
    "crates/cli",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
simucleo-core = { path = "crates/core" }
simucleo-cpu-armv7m = { path = "crates/cpu-armv7m" }
simucleo-periph-stm32f4 = { path = "crates/periph-stm32f4" }
simucleo-circuit = { path = "crates/circuit" }
simucleo-elf = { path = "crates/elf" }
simucleo-nucleo = { path = "crates/nucleo" }
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
yaxpeax-arch = { version = "0.3", default-features = false }
yaxpeax-arm = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
opt-level = 3
