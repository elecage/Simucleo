name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p simucleo-wasm --target wasm32-unknown-unknown

  firmware:
    # Builds the test firmware with arm-none-eabi-gcc, runs it on the
    # simulator, and compares the CPU core against Unicorn instruction by
    # instruction (the Unicorn dependency is feature-gated, test-only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
      - run: make -C firmware/bare-blinky
      - run: make -C firmware/exceptions
      - run: make -C firmware/difftest
      - name: Run firmware on the simulator
        run: cargo test --release -p simucleo-nucleo --test firmware -- --include-ignored
      - name: CLI smoke test
        run: cargo run --release -p simucleo-cli -- run firmware/bare-blinky/build/bare-blinky.elf --ms 500
      - name: Lock-step comparison with Unicorn
        run: |
          cargo clippy -p simucleo-difftest --features unicorn --all-targets -- -D warnings
          cargo test --release -p simucleo-difftest --features unicorn -- --nocapture

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run wasm
        working-directory: web
      - run: npm run build
        working-directory: web
