name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    # A full run takes a few minutes; fail fast if a step hangs (e.g. apt).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p simucleo-wasm --target wasm32-unknown-unknown

  firmware:
    # Builds the test firmware with arm-none-eabi-gcc, runs it on the
    # simulator, and compares the CPU core against Unicorn instruction by
    # instruction (the Unicorn dependency is feature-gated, test-only).
    runs-on: ubuntu-latest
    # A full run takes a few minutes; fail fast if a step hangs (e.g. apt).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The toolchain packages are cached: some Ubuntu mirrors serve them at
      # tens of KB/s, which alone can use up the job's time.
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-arm-toolchain-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-arm-toolchain-${{ runner.os }}-
      - name: Install the ARM toolchain
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-cache
          sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          pkgs="gcc-arm-none-eabi libnewlib-arm-none-eabi cmake"
          sudo apt-get update
          # A stalled mirror: switch to the main archive and go on (partial
          # downloads resume).
          if ! sudo timeout 420 apt-get install -y --no-install-recommends $pkgs; then
            echo "Slow mirror: retrying from archive.ubuntu.com"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $pkgs
          fi
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ || true
      - run: make -C firmware/bare-blinky
      - run: make -C firmware/exceptions
      - run: make -C firmware/difftest
      - run: make -C firmware/hal-blinky variants
      - run: make -C firmware/hal-uart-printf
      - run: for d in hal-button-exti hal-pwm-led hal-buzzer-melody hal-adc-servo hal-i2c-oled hal-spi-sd-logger hal-neopixel-dma hal-dht-capture hal-7seg-keypad hal-encoder-stepper-lcd hal-sonar-onewire hal-imu-matrix hal-ir-remote hal-onewire-multi hal-bluetooth-led hal-relay hal-servos-multi freertos-two-tasks freertos-queue-uart lesson-blink-2hz; do make -C firmware/$d; done
      - name: Run firmware on the simulator
        run: |
          cargo test --release -p simucleo-nucleo --test firmware -- --include-ignored
          cargo test --release -p simucleo-cli -- --include-ignored
      - name: CLI smoke test
        run: |
          cargo run --release -p simucleo-cli -- run firmware/bare-blinky/build/bare-blinky.elf --ms 500
          cargo run --release -p simucleo-cli -- run firmware/hal-uart-printf/build/hal-uart-printf.elf --ms 600 --input "hello" --input-at 300
          cargo run --release -p simucleo-cli -- run firmware/hal-blinky/build/hal-blinky-hse-crystal.elf --ms 300
      - name: Lock-step comparison with Unicorn
        run: |
          cargo clippy -p simucleo-difftest --features unicorn --all-targets -- -D warnings
          cargo test --release -p simucleo-difftest --features unicorn -- --nocapture

  web:
    runs-on: ubuntu-latest
    # A full run takes a few minutes; fail fast if a step hangs (e.g. apt).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Unit tests (lesson graders)
        run: npm test
        working-directory: web
      # The toolchain packages are cached: some Ubuntu mirrors serve them at
      # tens of KB/s, which alone can use up the job's time.
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-arm-toolchain-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-arm-toolchain-${{ runner.os }}-
      - name: Install the ARM toolchain
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-cache
          sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          pkgs="gcc-arm-none-eabi libnewlib-arm-none-eabi cmake"
          sudo apt-get update
          # A stalled mirror: switch to the main archive and go on (partial
          # downloads resume).
          if ! sudo timeout 420 apt-get install -y --no-install-recommends $pkgs; then
            echo "Slow mirror: retrying from archive.ubuntu.com"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $pkgs
          fi
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ || true
      - name: Build the example firmware bundled with the site
        run: |
          make -C firmware/bare-blinky
          make -C firmware/hal-blinky variants
          make -C firmware/hal-uart-printf
          for d in hal-button-exti hal-pwm-led hal-buzzer-melody hal-adc-servo hal-i2c-oled hal-spi-sd-logger hal-neopixel-dma hal-dht-capture hal-7seg-keypad hal-encoder-stepper-lcd hal-sonar-onewire hal-imu-matrix hal-ir-remote hal-onewire-multi hal-bluetooth-led hal-relay hal-servos-multi freertos-two-tasks freertos-queue-uart lesson-blink-2hz; do make -C firmware/$d; done
      - run: npm run examples
        working-directory: web
      - run: npm run wasm
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: End-to-end tests (wiring editor, running firmware)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        working-directory: web
