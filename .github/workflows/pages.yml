name: Deploy web app to GitHub Pages

# Builds the WebAssembly core and the web front-end and publishes them at
# https://elecage.github.io/Simucleo/. Requires Settings → Pages → Source:
# "GitHub Actions". Runs on every push to main, or manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A full run takes a few minutes; fail fast if a step hangs (e.g. apt).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI (same version as Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build the example firmware offered on the site
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
          make -C firmware/bare-blinky
          make -C firmware/hal-blinky variants
          make -C firmware/hal-uart-printf
          for d in hal-button-exti hal-pwm-led hal-buzzer-melody hal-adc-servo hal-i2c-oled hal-spi-sd-logger freertos-two-tasks freertos-queue-uart; do make -C firmware/$d; done
      - run: npm run examples
        working-directory: web
      - run: npm run wasm
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A full run takes a few minutes; fail fast if a step hangs (e.g. apt).
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
